# Release: publish a GitHub release (tag v<version>, where <version> is the version in tooth.json).
# Builds both DLLs on Windows, assembles the mod folders with the prebuilt DH_Terrain.material.bin from
# dist/materials/ and attaches Distant-Horizons-Bedrock-client-windows-x64.zip and
# Distant-Horizons-Bedrock-server-windows-x64.zip to the release. The release body comes from CHANGELOG.md.
on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type:
          - client
          - server
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -y

      - run: |
          xmake -w -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: |
            bin/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches tooth.json
        run: |
          ver=$(jq -r .version tooth.json)
          if [ "v$ver" != "${{ github.event.release.tag_name }}" ]; then
            echo "release tag ${{ github.event.release.tag_name }} != tooth.json version v$ver" >&2
            exit 1
          fi

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    strategy:
      matrix:
        target_type:
          - client
          - server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: artifact

      - name: Add the prebuilt LOD shader (client)
        if: matrix.target_type == 'client'
        run: |
          (cd dist/materials && sha256sum -c DH_Terrain.material.bin.sha256)
          mkdir -p artifact/DistantHorizons/materials
          cp dist/materials/DH_Terrain.material.bin artifact/DistantHorizons/materials/

      - run: |
          rm -f artifact/*/*.pdb
          cp CHANGELOG.md LICENSE LICENSE.LESSER LICENSE-LOGOS README.md artifact/

      - run: |
          zip -r ../${{ github.event.repository.name }}-${{ matrix.target_type }}-windows-x64.zip *
        working-directory: artifact

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.event.repository.name }}-${{ matrix.target_type }}-windows-x64.zip
